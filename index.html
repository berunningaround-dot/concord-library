<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Concord Library</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #1a1a1a;
    --muted: #666;
    --accent: #2563eb;
    --border: #e5e7eb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
  }
  header {
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding: 1.25rem 1.5rem;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  h1 {
    margin: 0;
    font-size: 1.75rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .glyph { font-size: 1.6rem; }
  .sub { margin: 0.25rem 0 0; color: var(--muted); font-size: 0.95rem; }

  .wrap { max-width: 1100px; margin: 0 auto; padding: 1.25rem 1.5rem 3rem; }

  .filters {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem;
    margin-bottom: 1rem;
    display: grid;
    gap: 0.75rem;
  }
  .row { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; }

  input[type="search"], select {
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 8px;
    padding: 0.55rem 0.75rem;
    font-size: 0.95rem;
    min-height: 40px;
  }
  input[type="search"] { flex: 1; min-width: 200px; }

  .alpha {
    display: flex;
    flex-wrap: wrap;
    gap: 0.35rem;
  }
  .alpha button, .clear-btn {
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 8px;
    padding: 0.4rem 0.65rem;
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    min-width: 36px;
  }
  .alpha button.active, .clear-btn:hover {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .alpha button:hover { background: #f3f4f6; }

  .stats { color: var(--muted); font-size: 0.9rem; margin-bottom: 0.75rem; }

  .results { display: grid; gap: 0.6rem; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.9rem 1rem;
  }
  .card h2 { margin: 0 0 0.25rem; font-size: 1.1rem; font-weight: 600; }
  .meta { color: var(--muted); font-size: 0.88rem; }
  a { color: var(--accent); text-decoration: none; font-weight: 500; }
  a:hover { text-decoration: underline; }
  .year { color: var(--accent); font-weight: 600; }

  .pager {
    display: flex;
    gap: 0.5rem;
    margin-top: 1rem;
    align-items: center;
  }
  .pager button {
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 8px;
    padding: 0.45rem 0.8rem;
    cursor: pointer;
  }
  .pager button:disabled { opacity: 0.4; cursor: not-allowed; }
</style>
</head>
<body>
<header>
  <h1><span class="glyph">🎭</span> Concord Library</h1>
  <p class="sub">Searchable catalog · Plays · Cast size · Year · Alphabet</p>
</header>

<div class="wrap">
  <div class="filters">
    <div class="row">
      <input type="search" id="q" placeholder="Search title, genre…">
      <select id="type">
        <option value="">All types</option>
        <option value="Play">Plays</option>
        <option value="Musical">Musicals</option>
      </select>
      <select id="cast">
        <option value="">Any cast</option>
        <option value="1">1</option>
        <option value="2">≤ 2</option>
        <option value="3">≤ 3</option>
        <option value="4">≤ 4</option>
        <option value="5">≤ 5</option>
        <option value="10">≤ 10</option>
      </select>
      <select id="year">
        <option value="">Any year</option>
        <option value="pre1950">Before 1950</option>
        <option value="1950-1979">1950–1979</option>
        <option value="1980-1999">1980–1999</option>
        <option value="2000-2014">2000–2014</option>
        <option value="2015">2015+</option>
      </select>
      <button class="clear-btn" id="clear">Clear all</button>
    </div>
    <div class="alpha" id="alpha"></div>
  </div>

  <div class="stats" id="stats"></div>
  <div class="results" id="results"></div>
  <div class="pager" id="pager"></div>
</div>

<script>
let DATA = [];
let currentPage = 1;
const PAGE_SIZE = 50;
let activeLetter = "";

const alphaEl = document.getElementById("alpha");
const letters = ["All", ..."ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("")];
letters.forEach(l => {
  const b = document.createElement("button");
  b.textContent = l === "All" ? "All" : l;
  b.dataset.letter = l === "All" ? "" : l;
  if (l === "All") b.classList.add("active");
  b.onclick = () => {
    activeLetter = b.dataset.letter;
    document.querySelectorAll("#alpha button").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    currentPage = 1;
    render();
  };
  alphaEl.appendChild(b);
});

async function load() {
  const res = await fetch("data.json");
  DATA = await res.json();
  DATA.sort((a, b) => (a.title || "").localeCompare(b.title || ""));
  render();
}

function matches(item, q, type, castMax, yearFilter) {
  const title = (item.title || "").trim();
  if (activeLetter && !title.toUpperCase().startsWith(activeLetter)) return false;

  const text = (title + " " + (item.genre||"") + " " + (item.type||"") + " " + (item.year||"")).toLowerCase();
  if (q && !text.includes(q.toLowerCase())) return false;
  if (type && item.type !== type) return false;
  if (castMax) {
    const c = parseInt(item.cast, 10);
    if (isNaN(c) || c > castMax) return false;
  }
  if (yearFilter) {
    const y = parseInt(item.year, 10);
    if (!y) return false;
    if (yearFilter === "pre1950" && y >= 1950) return false;
    if (yearFilter === "1950-1979" && (y < 1950 || y > 1979)) return false;
    if (yearFilter === "1980-1999" && (y < 1980 || y > 1999)) return false;
    if (yearFilter === "2000-2014" && (y < 2000 || y > 2014)) return false;
    if (yearFilter === "2015" && y < 2015) return false;
  }
  return true;
}

function render() {
  const q = document.getElementById("q").value.trim();
  const type = document.getElementById("type").value;
  const castMax = document.getElementById("cast").value ? parseInt(document.getElementById("cast").value, 10) : 0;
  const yearFilter = document.getElementById("year").value;

  const filtered = DATA.filter(item => matches(item, q, type, castMax, yearFilter));
  const total = filtered.length;
  const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  if (currentPage > pages) currentPage = pages;

  const start = (currentPage - 1) * PAGE_SIZE;
  const pageItems = filtered.slice(start, start + PAGE_SIZE);

  document.getElementById("stats").textContent =
    `${total.toLocaleString()} titles · page ${currentPage} of ${pages}`;

  document.getElementById("results").innerHTML = pageItems.map(item => `
    <div class="card">
      <h2>${item.title || "Untitled"}</h2>
      <div class="meta">
        ${item.type || "—"} · ${item.genre || "—"}
        ${item.cast ? ` · ${item.cast} cast` : ""}
        ${item.year ? ` · <span class="year">${item.year}</span>` : ""}
      </div>
      ${item.url ? `<div class="meta"><a href="${item.url}" target="_blank" rel="noopener">Open on Concord →</a></div>` : ""}
    </div>
  `).join("") || `<div class="card">No matches</div>`;

  const pager = document.getElementById("pager");
  pager.innerHTML = `
    <button ${currentPage <= 1 ? "disabled" : ""} onclick="currentPage--; render()">← Prev</button>
    <span>${currentPage} / ${pages}</span>
    <button ${currentPage >= pages ? "disabled" : ""} onclick="currentPage++; render()">Next →</button>
  `;
}

document.getElementById("q").addEventListener("input", () => { currentPage = 1; render(); });
document.getElementById("type").addEventListener("change", () => { currentPage = 1; render(); });
document.getElementById("cast").addEventListener("change", () => { currentPage = 1; render(); });
document.getElementById("year").addEventListener("change", () => { currentPage = 1; render(); });
document.getElementById("clear").addEventListener("click", () => {
  document.getElementById("q").value = "";
  document.getElementById("type").value = "";
  document.getElementById("cast").value = "";
  document.getElementById("year").value = "";
  activeLetter = "";
  document.querySelectorAll("#alpha button").forEach(x => x.classList.remove("active"));
  document.querySelector('#alpha button[data-letter=""]').classList.add("active");
  currentPage = 1;
  render();
});

load();
</script>
</body>
</html>
