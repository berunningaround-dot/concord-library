<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Concord Library · Text Only</title>
<style>
  :root { --bg: #0f0f0f; --fg: #e8e6e3; --accent: #f4a261; --muted: #888; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; line-height: 1.45; padding: 2rem 1.5rem; }
  h1 { font-size: 3.5rem; font-weight: 400; margin: 0 0 0.2rem; letter-spacing: -0.02em; }
  .glyph { font-size: 4rem; line-height: 1; display: inline-block; margin-right: 0.4rem; }
  .sub { color: var(--muted); font-size: 1.1rem; margin-bottom: 2rem; }
  .controls { display: flex; flex-wrap: wrap; gap: 0.8rem; margin-bottom: 1.5rem; align-items: end; }
  input, select { background: #1a1a1a; color: var(--fg); border: 1px solid #333; padding: 0.6rem 0.8rem; font-family: inherit; font-size: 1rem; }
  input[type="search"] { flex: 1; min-width: 220px; }
  button { background: var(--accent); color: #111; border: none; padding: 0.6rem 1rem; font-family: inherit; cursor: pointer; }
  .stats { color: var(--muted); margin-bottom: 1rem; font-size: 0.95rem; }
  .results { display: grid; gap: 0.6rem; }
  .card { border: 1px solid #222; padding: 0.8rem 1rem; background: #141414; }
  .card h2 { margin: 0 0 0.3rem; font-size: 1.25rem; font-weight: 500; }
  .meta { color: var(--muted); font-size: 0.9rem; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .year { color: var(--accent); }
  @media (max-width: 600px) { h1 { font-size: 2.4rem; } .glyph { font-size: 2.6rem; } }
</style>
</head>
<body>
  <div><span class="glyph">🎭</span><h1>Concord Library</h1></div>
  <p class="sub">Text-only searchable catalog · Plays · Cast · Year · Awards</p>
  <div class="controls">
    <input type="search" id="q" placeholder="Search title, genre, awards…">
    <select id="type"><option value="">All types</option><option value="Play">Plays</option><option value="Musical">Musicals</option></select>
    <select id="cast"><option value="">Any cast</option><option value="1">1</option><option value="2">≤2</option><option value="3">≤3</option><option value="4">≤4</option><option value="5">≤5</option><option value="10">≤10</option></select>
    <select id="year"><option value="">Any year</option><option value="pre1950">Before 1950</option><option value="1950-1979">1950–1979</option><option value="1980-1999">1980–1999</option><option value="2000-2014">2000–2014</option><option value="2015">2015+</option></select>
    <button id="clear">Clear</button>
  </div>
  <div class="stats" id="stats"></div>
  <div class="results" id="results"></div>
  <script>
    let DATA = [];
    async function load() { const res = await fetch('data.json'); DATA = await res.json(); render(); }
    function matches(item, q, type, castMax, yearFilter) {
      const text = (item.title + ' ' + item.genre + ' ' + item.type + ' ' + (item.year||'')).toLowerCase();
      if (q && !text.includes(q.toLowerCase())) return false;
      if (type && item.type !== type) return false;
      if (castMax) { const c = parseInt(item.cast, 10); if (isNaN(c) || c > castMax) return false; }
      if (yearFilter && item.year) {
        const y = parseInt(item.year, 10);
        if (yearFilter === 'pre1950' && y >= 1950) return false;
        if (yearFilter === '1950-1979' && (y < 1950 || y > 1979)) return false;
        if (yearFilter === '1980-1999' && (y < 1980 || y > 1999)) return false;
        if (yearFilter === '2000-2014' && (y < 2000 || y > 2014)) return false;
        if (yearFilter === '2015' && y < 2015) return false;
      } else if (yearFilter && !item.year) return false;
      return true;
    }
    function render() {
      const q = document.getElementById('q').value.trim();
      const type = document.getElementById('type').value;
      const castMax = document.getElementById('cast').value ? parseInt(document.getElementById('cast').value, 10) : 0;
      const yearFilter = document.getElementById('year').value;
      const filtered = DATA.filter(item => matches(item, q, type, castMax, yearFilter));
      document.getElementById('stats').textContent = filtered.length + ' titles';
      const html = filtered.slice(0, 200).map(item => `
        <div class="card">
          <h2>${item.title}</h2>
          <div class="meta">${item.type || '—'} · ${item.genre || '—'}${item.cast ? ' · ' + item.cast + ' cast' : ''}${item.year ? ' · <span class="year">' + item.year + '</span>' : ''}</div>
          ${item.url ? `<div class="meta"><a href="${item.url}" target="_blank">Open on Concord →</a></div>` : ''}
        </div>`).join('');
      document.getElementById('results').innerHTML = html || '<div class="card">No matches</div>';
    }
    document.getElementById('q').addEventListener('input', render);
    document.getElementById('type').addEventListener('change', render);
    document.getElementById('cast').addEventListener('change', render);
    document.getElementById('year').addEventListener('change', render);
    document.getElementById('clear').addEventListener('click', () => {
      document.getElementById('q').value = '';
      document.getElementById('type').value = '';
      document.getElementById('cast').value = '';
      document.getElementById('year').value = '';
      render();
    });
    load();
  </script>
</body>
</html>
