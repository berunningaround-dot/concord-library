<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Samuel French Library</title>
<style>
  :root { --bg: #f6f7f9; --card: #ffffff; --text: #1a1a1a; --muted: #666; --accent: #2563eb; --border: #e5e7eb; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.4; font-size: 14px; }
  header { background: #fff; border-bottom: 1px solid var(--border); padding: 0.8rem 1.2rem; position: sticky; top: 0; z-index: 10; }
  h1 { margin: 0; font-size: 1.35rem; font-weight: 600; display: flex; align-items: center; gap: 0.4rem; }
  .glyph { font-size: 1.25rem; }
  .sub { margin: 0.15rem 0 0; color: var(--muted); font-size: 0.85rem; }
  .layout { display: grid; grid-template-columns: 220px 1fr; gap: 1rem; max-width: 1200px; margin: 0 auto; padding: 1rem 1.2rem 2rem; }
  @media (max-width: 800px) { .layout { grid-template-columns: 1fr; } }
  .sidebar { background: #fff; border: 1px solid var(--border); border-radius: 6px; padding: 0.9rem; height: fit-content; position: sticky; top: 70px; }
  .sidebar h3 { margin: 0 0 0.5rem; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
  .sidebar label { display: flex; align-items: center; gap: 0.4rem; font-size: 0.85rem; margin: 0.25rem 0; cursor: pointer; }
  .sidebar input[type="checkbox"] { margin: 0; }
  .main { min-width: 0; }
  .filters { background: #fff; border: 1px solid var(--border); border-radius: 6px; padding: 0.75rem; margin-bottom: 0.75rem; display: grid; gap: 0.5rem; }
  .row { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
  input[type="search"], select { border: 1px solid var(--border); background: #fff; border-radius: 4px; padding: 0.4rem 0.6rem; font-size: 0.9rem; min-height: 34px; }
  input[type="search"] { flex: 1; min-width: 180px; }
  .alpha { display: flex; flex-wrap: wrap; gap: 0.25rem; }
  .alpha button, .clear-btn { border: 1px solid var(--border); background: #fff; border-radius: 4px; padding: 0.3rem 0.5rem; font-size: 0.75rem; font-weight: 500; cursor: pointer; min-width: 28px; }
  .alpha button.active, .clear-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
  .alpha button:hover { background: #f3f4f6; }
  .stats { color: var(--muted); font-size: 0.8rem; margin-bottom: 0.4rem; }
  .results { display: grid; gap: 0.3rem; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 4px; padding: 0.45rem 0.7rem; }
  .title-line { margin: 0; font-size: 0.95rem; font-weight: 600; }
  .meta { color: var(--muted); font-size: 0.75rem; margin-top: 0.1rem; }
  a.glyph-link { color: var(--accent); text-decoration: none; font-size: 0.85rem; margin-left: 0.3rem; }
  a.glyph-link:hover { opacity: 0.7; }
  .year { color: var(--accent); font-weight: 600; }
  .pager { display: flex; gap: 0.4rem; margin-top: 0.75rem; align-items: center; font-size: 0.85rem; }
  .pager button { border: 1px solid var(--border); background: #fff; border-radius: 4px; padding: 0.35rem 0.65rem; cursor: pointer; font-size: 0.8rem; }
  .pager button:disabled { opacity: 0.4; cursor: not-allowed; }
</style>
</head>
<body>
<header>
  <h1><span class="glyph">🎭</span> SAMUEL FRENCH Library</h1>
  <p class="sub">Searchable catalog · Plays · Cast · Year · Awards · Alphabet</p>
</header>
<div class="layout">
  <aside class="sidebar">
    <h3>Type</h3>
    <label><input type="checkbox" class="filter-type" value="Play" checked> Plays</label>
    <label><input type="checkbox" class="filter-type" value="Musical" checked> Musicals</label>
    <h3 style="margin-top:1rem">Cast size</h3>
    <label><input type="checkbox" class="filter-cast" value="1"> 1</label>
    <label><input type="checkbox" class="filter-cast" value="2"> ≤2</label>
    <label><input type="checkbox" class="filter-cast" value="3"> ≤3</label>
    <label><input type="checkbox" class="filter-cast" value="4"> ≤4</label>
    <label><input type="checkbox" class="filter-cast" value="5"> ≤5</label>
    <label><input type="checkbox" class="filter-cast" value="10"> ≤10</label>
    <h3 style="margin-top:1rem">Year</h3>
    <label><input type="checkbox" class="filter-year" value="pre1950"> Before 1950</label>
    <label><input type="checkbox" class="filter-year" value="1950-1979"> 1950–1979</label>
    <label><input type="checkbox" class="filter-year" value="1980-1999"> 1980–1999</label>
    <label><input type="checkbox" class="filter-year" value="2000-2014"> 2000–2014</label>
    <label><input type="checkbox" class="filter-year" value="2015"> 2015+</label>
    <label><input type="checkbox" class="filter-year" value="unknown"> No year listed</label>
    <h3 style="margin-top:1rem">Iconic</h3>
    <label><input type="checkbox" class="filter-iconic" value="yes"> Famous / classic plays</label>
  </aside>
  <main class="main">
    <div class="filters">
      <div class="row">
        <input type="search" id="q" placeholder="Search title, author, genre…">
        <select id="sort">
          <option value="title">Sort: Title A–Z</option>
          <option value="year-asc">Sort: Year oldest first</option>
          <option value="year-desc">Sort: Year newest first</option>
        </select>
        <button class="clear-btn" id="clear">Clear</button>
      </div>
      <div class="alpha" id="alpha"></div>
    </div>
    <div class="stats" id="stats"></div>
    <div class="results" id="results"></div>
    <div class="pager" id="pager"></div>
  </main>
</div>
<script>
const ICONIC = new Set([
  "A Streetcar Named Desire","The Glass Menagerie","Cat on a Hot Tin Roof","A Raisin in the Sun",
  "Waiting for Godot","Who's Afraid of Virginia Woolf?","Our Town","Arcadia","Noises Off",
  "Barefoot in the Park","The Odd Couple","August Wilson's Fences","Rosencrantz and Guildenstern Are Dead",
  "The Real Thing","Betrayal","The Birthday Party","The Caretaker","The Homecoming",
  "Endgame","Krapp's Last Tape","Happy Days","The Zoo Story",
  "A Doll's House (Hampton, trans.)","Hedda Gabler (Hampton)","The Cherry Orchard (Frayn)",
  "Uncle Vanya (Frayn)","The Seagull (Frayn)","The Importance of Being Earnest (Original 4 Act Version)"
]);
let DATA = [];
let currentPage = 1;
const PAGE_SIZE = 80;
let activeLetter = "";
const alphaEl = document.getElementById("alpha");
const letters = ["All", ..."ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("")];
letters.forEach(l => {
  const b = document.createElement("button");
  b.textContent = l === "All" ? "All" : l;
  b.dataset.letter = l === "All" ? "" : l;
  if (l === "All") b.classList.add("active");
  b.onclick = () => {
    activeLetter = b.dataset.letter;
    document.querySelectorAll("#alpha button").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    currentPage = 1;
    render();
  };
  alphaEl.appendChild(b);
});
async function load() {
  const res = await fetch("data.json");
  DATA = await res.json();
  render();
}
function getChecked(sel) {
  return [...document.querySelectorAll(sel + ":checked")].map(el => el.value);
}
function matches(item, q) {
  const title = (item.title || "").trim();
  if (activeLetter && !title.toUpperCase().startsWith(activeLetter)) return false;
  const author = item.author || "";
  const text = (title + " " + author + " " + (item.genre||"") + " " + (item.type||"") + " " + (item.year||"")).toLowerCase();
  if (q && !text.includes(q.toLowerCase())) return false;
  const types = getChecked(".filter-type");
  if (types.length && item.type && !types.includes(item.type)) return false;
  const casts = getChecked(".filter-cast").map(Number);
  if (casts.length) {
    const c = parseInt(item.cast, 10);
    if (isNaN(c) || !casts.some(max => c <= max)) return false;
  }
  const years = getChecked(".filter-year");
  if (years.length) {
    const y = parseInt(item.year, 10);
    const hasUnknown = years.includes("unknown");
    const ranges = years.filter(r => r !== "unknown");
    if (!y) {
      if (!hasUnknown) return false;
    } else {
      const ok = ranges.some(range => {
        if (range === "pre1950") return y < 1950;
        if (range === "1950-1979") return y >= 1950 && y <= 1979;
        if (range === "1980-1999") return y >= 1980 && y <= 1999;
        if (range === "2000-2014") return y >= 2000 && y <= 2014;
        if (range === "2015") return y >= 2015;
        return false;
      });
      if (!ok && ranges.length) return false;
    }
  }
  const iconic = getChecked(".filter-iconic");
  if (iconic.includes("yes") && !ICONIC.has(item.title)) return false;
  return true;
}
function sortItems(items, mode) {
  const arr = [...items];
  if (mode === "year-asc") {
    arr.sort((a, b) => {
      const ya = parseInt(a.year, 10) || 9999;
      const yb = parseInt(b.year, 10) || 9999;
      return ya - yb || (a.title || "").localeCompare(b.title || "");
    });
  } else if (mode === "year-desc") {
    arr.sort((a, b) => {
      const ya = parseInt(a.year, 10) || 0;
      const yb = parseInt(b.year, 10) || 0;
      return yb - ya || (a.title || "").localeCompare(b.title || "");
    });
  } else {
    arr.sort((a, b) => (a.title || "").localeCompare(b.title || ""));
  }
  return arr;
}
function render() {
  const q = document.getElementById("q").value.trim();
  const sortMode = document.getElementById("sort").value;
  let filtered = DATA.filter(item => matches(item, q));
  filtered = sortItems(filtered, sortMode);
  const total = filtered.length;
  const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  if (currentPage > pages) currentPage = pages;
  const start = (currentPage - 1) * PAGE_SIZE;
  const pageItems = filtered.slice(start, start + PAGE_SIZE);
  document.getElementById("stats").textContent = `${total.toLocaleString()} titles · page ${currentPage} of ${pages}`;
  document.getElementById("results").innerHTML = pageItems.map(item => {
    const title = item.title || "Untitled";
    const author = item.author || "";
    const genre = item.genre || "";
    const type = item.type || "";
    const women = item.women || "";
    const men = item.men || "";
    const year = item.year || "";
    let castStr = "";
    if (women || men) {
      const parts = [];
      if (women) parts.push(`Women ${women}`);
      if (men) parts.push(`Men ${men}`);
      castStr = `Cast: ${parts.join(", ")}`;
    } else if (item.cast) {
      castStr = `Cast: ${item.cast}`;
    }
    const metaParts = [];
    if (author) metaParts.push(`Author: ${author}`);
    if (genre) metaParts.push(`Genre: ${genre}`);
    if (type) metaParts.push(type);
    if (castStr) metaParts.push(castStr);
    if (year) metaParts.push(year);
    const meta = metaParts.join(" - ");
    return `<div class="card"><div class="title-line">${title}${item.url ? ` <a class="glyph-link" href="${item.url}" target="_blank" rel="noopener" title="Open on Concord">🔗</a>` : ""}</div><div class="meta">${meta}</div></div>`;
  }).join("") || `<div class="card">No matches</div>`;
  const pager = document.getElementById("pager");
  pager.innerHTML = `<button ${currentPage <= 1 ? "disabled" : ""} onclick="currentPage--; render()">← Prev</button><span>${currentPage} / ${pages}</span><button ${currentPage >= pages ? "disabled" : ""} onclick="currentPage++; render()">Next →</button>`;
}
document.getElementById("q").addEventListener("input", () => { currentPage = 1; render(); });
document.getElementById("sort").addEventListener("change", () => { currentPage = 1; render(); });
document.querySelectorAll(".filter-type, .filter-cast, .filter-year, .filter-iconic").forEach(el => {
  el.addEventListener("change", () => { currentPage = 1; render(); });
});
document.getElementById("clear").addEventListener("click", () => {
  document.getElementById("q").value = "";
  document.getElementById("sort").value = "title";
  document.querySelectorAll(".filter-type, .filter-cast, .filter-year, .filter-iconic").forEach(el => el.checked = false);
  document.querySelectorAll(".filter-type").forEach(el => el.checked = true);
  activeLetter = "";
  document.querySelectorAll("#alpha button").forEach(x => x.classList.remove("active"));
  document.querySelector('#alpha button[data-letter=""]').classList.add("active");
  currentPage = 1;
  render();
});
load();
</script>
</body>
</html>
